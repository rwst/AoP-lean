name = "AoPPhysics"
defaultTargets = ["ForMathlib", "SuperpositionAndLinearity", "SuperpositionAndMultipleMixtures",
  "BornRuleEntropy", "ClassicalUncertaintyPrinciple", "PureStatesNotEnough", "NonLinearQuantum",
  "InconsistentConvergence", "SchwartzMomentProblem", "EntropyTopology", "HilbertUnphysicality",
  "SchwartzNorms", "QuantumVectorSpaces", "UnitaryEntropy", "SchroedingerEvolution",
  "ProjectiveMeasurement", "UnitaryProjectiveEvolution", "ForPhyslib"]

# physlib's own pin is Mathlib v4.35.0; the root Mathlib below takes precedence.
# Pinned (2026-10-30): the infinite-dimensional layer builds on PhyslibAlpha (trace class,
# unbounded spectral theorem, Stone), which is the less stable part of physlib.
[[require]]
name = "physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "848dca442b63be5fd69c82b84ae42b0632941864"

# TauCeti, on the same Mathlib commit as the root pin below. Keep it out of defaultTargets
# and never `lake build TauCeti`: only the TauCeti modules we import get compiled.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "eb4dd2412a1cd62f73128361bfd3cb422df32e37"

# Same Mathlib commit as TauCeti (eb4dd24); lake-manifest.json carries the exact pin.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "2cabef97b63d3275776b8b060d802de6a6fa1055"

# Material that belongs in Mathlib, in Mathlib's directory layout.
[[lean_lib]]
name = "ForMathlib"
globs = ["ForMathlib.+"]

# Material that belongs in physlib, in physlib's directory layout (without `Physlib/`).
[[lean_lib]]
name = "ForPhyslib"
globs = ["ForPhyslib.+"]

# Technical brief: directional vectors vs quantum state vectors.
[[lean_lib]]
name = "SuperpositionAndLinearity"
srcDir = "briefs/SuperpositionAndLinearity"

# Its comparator lane (not default targets; see COMPARATOR.md).
[[lean_lib]]
name = "ChallengeSuperpositionAndLinearity"
srcDir = "briefs/SuperpositionAndLinearity/comparator"

[[lean_lib]]
name = "SolutionSuperpositionAndLinearity"
srcDir = "briefs/SuperpositionAndLinearity/comparator"

# Technical brief: superpositions correspond to multiple decompositions.
[[lean_lib]]
name = "SuperpositionAndMultipleMixtures"
srcDir = "briefs/SuperpositionAndMultipleMixtures"

# Its comparator lane (not default targets; see COMPARATOR.md).
[[lean_lib]]
name = "ChallengeSuperpositionAndMultipleMixtures"
srcDir = "briefs/SuperpositionAndMultipleMixtures/comparator"

[[lean_lib]]
name = "SolutionSuperpositionAndMultipleMixtures"
srcDir = "briefs/SuperpositionAndMultipleMixtures/comparator"

# Technical brief: the Born rule is equivalent to the von Neumann entropy.
[[lean_lib]]
name = "BornRuleEntropy"
srcDir = "briefs/BornRuleEntropy"

# Its comparator lane (not default targets; see COMPARATOR.md): the generated statements of
# record, and the re-export of the modules that prove them.
[[lean_lib]]
name = "ChallengeBornRuleEntropy"
srcDir = "briefs/BornRuleEntropy/comparator"

[[lean_lib]]
name = "SolutionBornRuleEntropy"
srcDir = "briefs/BornRuleEntropy/comparator"

